<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Hand Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw}
#wrap{position:relative;width:100vw;height:100vh}
#vid{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
#oc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.corner{position:absolute;width:18px;height:18px;pointer-events:none;z-index:5}
.corner.tl{top:50px;left:10px;border-top:2px solid rgba(220,195,140,.5);border-left:2px solid rgba(220,195,140,.5)}
.corner.tr{top:50px;right:10px;border-top:2px solid rgba(220,195,140,.5);border-right:2px solid rgba(220,195,140,.5)}
.corner.bl{bottom:50px;left:10px;border-bottom:2px solid rgba(220,195,140,.5);border-left:2px solid rgba(220,195,140,.5)}
.corner.br{bottom:50px;right:10px;border-bottom:2px solid rgba(220,195,140,.5);border-right:2px solid rgba(220,195,140,.5)}
.scan{position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(220,195,140,.3),transparent);animation:scan 3s linear infinite;pointer-events:none;z-index:4}
@keyframes scan{0%{top:0}100%{top:100%}}
#topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
.spill{display:flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);font-size:.68rem;color:#94a3b8;font-family:monospace;backdrop-filter:blur(10px)}
.sd{width:6px;height:6px;border-radius:50%;background:#ef4444}
.sd.on{background:#10b981;box-shadow:0 0 7px #10b981;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#fps-b{font-family:monospace;font-size:.68rem;color:#10b981;background:rgba(0,0,0,.5);border:1px solid rgba(16,185,129,.25);padding:3px 9px;border-radius:6px}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.pbtn{width:32px;height:32px;border-radius:50%;border:2px solid rgba(220,195,140,.25);background:rgba(0,0,0,.5);color:rgba(220,195,140,.5);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:monospace;display:flex;align-items:center;justify-content:center}
.pbtn.active{border-color:rgb(220,195,140);background:rgba(220,195,140,.15);color:rgb(235,215,165);box-shadow:0 0 12px rgba(220,195,140,.35)}
.dv{width:1px;height:20px;background:rgba(255,255,255,.1)}
.mbtn{padding:5px 14px;border-radius:16px;border:1px solid rgba(220,195,140,.2);background:rgba(0,0,0,.5);color:rgba(220,195,140,.4);font-size:.7rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.mbtn.active{border-color:rgb(220,195,140);background:rgba(220,195,140,.12);color:rgb(235,215,165);box-shadow:0 0 10px rgba(220,195,140,.25)}
.plbl{font-size:.58rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
#gl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.95rem;font-weight:700;color:rgba(235,215,165,.95);text-shadow:0 2px 8px rgba(0,0,0,.9);background:rgba(0,0,0,.4);padding:4px 14px;border-radius:20px;border:1px solid rgba(220,195,140,.3);display:none;z-index:10;pointer-events:none}
#gl.show{display:block;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#loading{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:14px}
#loading.hidden{display:none}
.lring{width:50px;height:50px;border:3px solid rgba(220,195,140,.2);border-top-color:rgb(220,195,140);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{color:rgba(220,195,140,.8);font-size:.78rem;letter-spacing:1px;font-family:monospace}
</style>
</head>
<body>
<div id="wrap">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="oc"></canvas>
  <div class="scan"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="topbar">
    <div class="spill"><div class="sd" id="sd"></div><span id="stxt">Starting…</span></div>
    <div id="fps-b">-- FPS</div>
  </div>
  <div id="gl"></div>
  <div id="controls">
    <span class="plbl">Persons:</span>
    <button class="pbtn active" id="p1" onclick="setP(1)">1</button>
    <button class="pbtn" id="p2" onclick="setP(2)">2</button>
    <button class="pbtn" id="p3" onclick="setP(3)">3</button>
    <div class="dv"></div>
    <button class="mbtn" id="m-none" onclick="setMode('none')">None</button>
    <button class="mbtn active" id="m-hands" onclick="setMode('hands')">✋ Hands</button>
  </div>
  <div id="loading"><div class="lring"></div><div class="ltxt" id="ltxt">Loading…</div></div>
</div>

<!-- MediaPipe Hands ONLY — lightest, fastest -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const vid=document.getElementById('vid'),oc=document.getElementById('oc'),ctx=oc.getContext('2d');
let mode='hands',maxP=1,frames=0,lastT=0,gtT=null;
let lHand=null,rHand=null;

function setP(n){maxP=n;[1,2,3].forEach(i=>document.getElementById('p'+i).classList.toggle('active',i===n));}
function setMode(m){mode=m;['none','hands'].forEach(x=>document.getElementById('m-'+x).classList.toggle('active',x===m));}

// ── SMOOTHER: alpha=0.7 = FAST response ───────────────────────
class Sm{
  constructor(){this.p=null;}
  run(lm){
    if(!lm){this.p=null;return null;}
    if(!this.p){this.p=lm.map(k=>({...k}));return this.p;}
    // alpha 0.7 = very fast tracking, minimal lag
    this.p=lm.map((k,i)=>{
      const q=this.p[i]||k;
      return{x:q.x+.7*(k.x-q.x),y:q.y+.7*(k.y-q.y)};
    });
    return this.p;
  }
}
const SML=new Sm(),SMR=new Sm();

// ── BONE COLORS: ivory/cream ───────────────────────────────────
const BM=a=>`rgba(222,196,142,${a})`;
const BH=a=>`rgba(252,238,195,${a})`;
const BS=a=>`rgba(155,128,72,${a})`;

// ── DRAW BONE SEGMENT ──────────────────────────────────────────
function drawBone(ax,ay,bx,by,thick){
  // shadow
  ctx.save();
  ctx.beginPath();ctx.moveTo(ax+1.5,ay+1.5);ctx.lineTo(bx+1.5,by+1.5);
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=thick+2;
  ctx.lineCap='round';ctx.filter='blur(2px)';ctx.stroke();ctx.restore();
  // outer glow
  ctx.save();
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
  ctx.strokeStyle=BH(.06);ctx.lineWidth=thick+12;
  ctx.lineCap='round';ctx.filter='blur(8px)';ctx.stroke();ctx.restore();
  // bone with 3D cross gradient
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
  const nx=dy/len*thick*.45,ny=-dx/len*thick*.45;
  const g=ctx.createLinearGradient(ax+nx,ay+ny,ax-nx,ay-ny);
  g.addColorStop(0,BS(.65));
  g.addColorStop(.25,BH(.9));
  g.addColorStop(.5,BM(.95));
  g.addColorStop(.75,BH(.85));
  g.addColorStop(1,BS(.6));
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
  ctx.strokeStyle=g;ctx.lineWidth=thick;ctx.lineCap='round';ctx.stroke();
}

// ── DRAW JOINT (3D sphere) ─────────────────────────────────────
function drawJoint(x,y,r){
  // shadow
  ctx.beginPath();ctx.arc(x+1,y+1,r,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fill();
  // radial gradient sphere
  const sg=ctx.createRadialGradient(x-r*.38,y-r*.4,r*.05,x,y,r);
  sg.addColorStop(0,BH(1));
  sg.addColorStop(.35,BM(.95));
  sg.addColorStop(.75,BM(.65));
  sg.addColorStop(1,BS(.5));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
  // specular
  ctx.beginPath();ctx.arc(x-r*.3,y-r*.33,r*.28,0,Math.PI*2);
  ctx.fillStyle=BH(.55);ctx.fill();
}

// ── HAND CONNECTIONS ──────────────────────────────────────────
const HC=[
  [0,1],[1,2],[2,3],[3,4],          // thumb
  [0,5],[5,6],[6,7],[7,8],          // index
  [5,9],[9,10],[10,11],[11,12],     // middle
  [9,13],[13,14],[14,15],[15,16],   // ring
  [13,17],[17,18],[18,19],[19,20],  // pinky
  [0,17],[5,9],[9,13]               // palm
];
const TIPS=[4,8,12,16,20];
// Thickness per segment
function thick(a,b){
  if(a===0||b===0)return 6;           // wrist
  if([1,5,9,13,17].includes(a)||[1,5,9,13,17].includes(b))return 5; // MCP
  if([2,6,10,14,18].includes(a)||[2,6,10,14,18].includes(b))return 4.5; // PIP
  return 3.5;                          // DIP + tips
}

function drawHand(kps,W,H){
  if(!kps||kps.length<21)return;
  const p=k=>({x:kps[k].x*W,y:kps[k].y*H});

  // Palm fill for volume
  const palmPts=[0,1,5,9,13,17].map(i=>p(i));
  ctx.save();
  ctx.beginPath();palmPts.forEach((q,i)=>i===0?ctx.moveTo(q.x,q.y):ctx.lineTo(q.x,q.y));
  ctx.closePath();ctx.fillStyle=BM(.12);ctx.fill();ctx.restore();

  // Bones
  HC.forEach(([a,b])=>{
    const pa=p(a),pb=p(b);
    drawBone(pa.x,pa.y,pb.x,pb.y,thick(a,b));
  });

  // Joints
  for(let i=0;i<21;i++){
    const q=p(i);
    const r=i===0?8:TIPS.includes(i)?6:i<=4?4.5:4;
    drawJoint(q.x,q.y,r);
  }
}

// ── GESTURE ───────────────────────────────────────────────────
function gesture(kps){
  if(!kps||kps.length<21)return'';
  const tips=[4,8,12,16,20],mcp=[2,5,9,13,17];
  const e=[1,2,3,4].map(i=>kps[tips[i]].y<kps[mcp[i]].y);
  const th=Math.abs(kps[4].x-kps[2].x)>0.06;
  if(e.every(Boolean)&&th)return'Open ✋';
  if(e.every(f=>!f)&&!th)return'Fist ✊';
  if(e[1]&&!e[0]&&!e[2]&&!e[3])return'Point ☝';
  if(e[1]&&e[2]&&!e[0]&&!e[3])return'Peace ✌';
  if(th&&!e[1]&&!e[2]&&!e[3])return'Thumbs 👍';
  return'';
}
function showG(g){
  if(!g)return;
  const el=document.getElementById('gl');
  if(g!==el.textContent){
    el.textContent=g;el.classList.remove('show');
    void el.offsetWidth;el.classList.add('show');
    clearTimeout(gtT);gtT=setTimeout(()=>el.classList.remove('show'),1800);
  }
}

// ── RENDER LOOP ───────────────────────────────────────────────
function render(){
  oc.width=vid.videoWidth||640;
  oc.height=vid.videoHeight||480;
  ctx.clearRect(0,0,oc.width,oc.height);

  if(mode==='hands'){
    const W=oc.width,H=oc.height;
    if(lHand)drawHand(lHand,W,H);
    if(rHand)drawHand(rHand,W,H);
  }

  frames++;
  const now=performance.now();
  if(now-lastT>=1000){
    const fps=Math.round(frames*1000/(now-lastT));
    frames=0;lastT=now;
    document.getElementById('fps-b').textContent=fps+' FPS';
  }
  requestAnimationFrame(render);
}

// ── MEDIAPIPE HANDS (lightest model, max speed) ───────────────
function init(){
  const hands=new Hands({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands:2,
    modelComplexity:0,              // 0 = FASTEST
    minDetectionConfidence:0.6,
    minTrackingConfidence:0.5
  });

  hands.onResults(r=>{
    lHand=null;rHand=null;
    const ml=r.multiHandLandmarks||[];
    const mh=r.multiHandedness||[];
    ml.forEach((lm,i)=>{
      const side=(mh[i]?.label)||'Right';
      if(side==='Left'){lHand=SML.run(lm);}
      else{rHand=SMR.run(lm);}
      showG(gesture(lm));
    });
    if(ml.length===0){SML.run(null);SMR.run(null);}
  });

  hands.initialize().then(()=>{
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('sd').classList.add('on');
    document.getElementById('stxt').textContent='AI Active';
    // MAX SPEED: send every frame, no throttle
    function send(){
      if(vid.readyState>=2) hands.send({image:vid});
      requestAnimationFrame(send);
    }
    send();
  }).catch(e=>{
    document.getElementById('ltxt').textContent='Failed: '+(e?.message||e);
  });
}

// ── AUTO CAMERA ───────────────────────────────────────────────
navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false
}).then(s=>{
  vid.srcObject=s;
  vid.onloadedmetadata=()=>{vid.play();render();setTimeout(init,100);};
}).catch(e=>{
  document.getElementById('ltxt').textContent='Camera: '+(e?.message||e);
  document.getElementById('stxt').textContent='Camera denied';
});
</script>
</body>
</html>
