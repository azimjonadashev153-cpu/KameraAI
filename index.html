<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Hand Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#f1f5f9;font-family:Inter,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(15,23,42,0.8);border-bottom:1px solid rgba(0,212,255,0.2);backdrop-filter:blur(20px);flex-shrink:0}
.logo{font-size:1.1rem;font-weight:700;background:linear-gradient(90deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:#94a3b8}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444;transition:all 0.3s}
.dot.active{background:#10b981;box-shadow:0 0 10px #10b981;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#main{display:flex;flex:1;gap:12px;padding:12px;min-height:0;overflow:hidden}
#cam-wrap{position:relative;flex:1;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(0,212,255,0.2)}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
#fps{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);color:#10b981;font-size:0.7rem;font-family:monospace;padding:3px 8px;border-radius:6px;border:1px solid rgba(16,185,129,0.3)}
.corner{position:absolute;width:20px;height:20px;pointer-events:none}
.corner.tl{top:8px;left:8px;border-top:2px solid #00d4ff;border-left:2px solid #00d4ff}
.corner.tr{top:8px;right:8px;border-top:2px solid #00d4ff;border-right:2px solid #00d4ff}
.corner.bl{bottom:8px;left:8px;border-bottom:2px solid #00d4ff;border-left:2px solid #00d4ff}
.corner.br{bottom:8px;right:8px;border-bottom:2px solid #00d4ff;border-right:2px solid #00d4ff}
#panel{width:280px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.card{background:rgba(15,23,42,0.7);border:1px solid rgba(0,212,255,0.15);border-radius:12px;padding:14px;backdrop-filter:blur(20px)}
.card h3{font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:10px}
.mode-btns{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{padding:6px 12px;border-radius:20px;font-size:0.72rem;font-weight:600;border:1px solid rgba(0,212,255,0.3);color:#94a3b8;background:rgba(255,255,255,0.04);cursor:pointer;transition:all 0.2s}
.mbtn.active{background:rgba(0,212,255,0.15);border-color:#00d4ff;color:#00d4ff;box-shadow:0 0 10px rgba(0,212,255,0.3)}
.mbtn.hands.active{background:rgba(52,211,153,0.15);border-color:#34d399;color:#34d399}
.mbtn.full.active{background:rgba(168,85,247,0.15);border-color:#a855f7;color:#a855f7}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px;text-align:center}
.stat-val{font-size:1.2rem;font-weight:700;color:#00d4ff;font-family:monospace}
.stat-lbl{font-size:0.6rem;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.hand-row{display:flex;justify-content:space-around;padding:4px 0}
.hand-item{text-align:center}
.hand-icon{font-size:1.8rem;transition:transform 0.3s}
.hand-item.active .hand-icon{animation:float 1s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hand-lbl{font-size:0.62rem;color:#64748b;text-transform:uppercase;letter-spacing:0.5px}
.hand-gest{font-size:0.7rem;color:#34d399;font-weight:600;margin-top:2px;min-height:16px}
#log{height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.log-line{font-size:0.68rem;display:flex;gap:8px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-t{color:#475569;font-family:monospace;flex-shrink:0}
.log-m{color:#94a3b8}
.log-m.ok{color:#10b981}.log-m.warn{color:#f59e0b}.log-m.det{color:#00d4ff}
#footer{padding:6px 20px;text-align:center;font-size:0.65rem;color:#334155;border-top:1px solid rgba(0,212,255,0.1);flex-shrink:0}
</style>
</head>
<body>
<div id="header">
  <div class="logo">&#x2B21; AI Hand Tracker</div>
  <div class="status"><div class="dot" id="dot"></div><span id="stxt">Starting camera&#x2026;</span></div>
  <div style="font-size:0.75rem;color:#00d4ff;font-family:monospace" id="clock"></div>
</div>
<div id="main">
  <div id="cam-wrap">
    <video id="vid" autoplay playsinline muted></video>
    <canvas id="cvs"></canvas>
    <div id="fps">0 FPS</div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div id="panel">
    <div class="card">
      <h3>Skeleton Mode</h3>
      <div class="mode-btns">
        <button class="mbtn active" id="m-none" onclick="setMode('none')">None</button>
        <button class="mbtn hands" id="m-hands" onclick="setMode('hands')">&#x270B; Hands</button>
        <button class="mbtn full" id="m-full" onclick="setMode('full')">&#x1F9B4; Full Body</button>
      </div>
    </div>
    <div class="card">
      <h3>Stats</h3>
      <div class="stat-grid">
        <div class="stat"><div class="stat-val" id="s-fps">0</div><div class="stat-lbl">FPS</div></div>
        <div class="stat"><div class="stat-val" id="s-hands">0</div><div class="stat-lbl">Hands</div></div>
        <div class="stat"><div class="stat-val" id="s-conf">&#x2014;</div><div class="stat-lbl">Confidence</div></div>
        <div class="stat"><div class="stat-val" id="s-res">&#x2014;</div><div class="stat-lbl">Resolution</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Hand Status</h3>
      <div class="hand-row">
        <div class="hand-item" id="hi-left">
          <div class="hand-icon">&#x270B;</div>
          <div class="hand-lbl">Left</div>
          <div class="hand-gest" id="hg-left"></div>
        </div>
        <div class="hand-item" id="hi-right">
          <div class="hand-icon" style="transform:scaleX(-1)">&#x270B;</div>
          <div class="hand-lbl">Right</div>
          <div class="hand-gest" id="hg-right"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>Event Log</h3>
      <div id="log"></div>
    </div>
  </div>
</div>
<div id="footer">AI Hand Tracker &middot; Infinity Intelligence &middot; Powered by MediaPipe Hands</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const vid=document.getElementById('vid');
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let mode='none', lastT=0, frameCount=0, fps=0;
let leftHand=null, rightHand=null;

// Clock
setInterval(()=>{
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour12:false});
},1000);

// Log
function log(msg,type=''){
  const d=document.getElementById('log');
  const t=new Date().toLocaleTimeString('en-US',{hour12:false});
  const l=document.createElement('div');
  l.className='log-line';
  l.innerHTML='<span class="log-t">'+t+'</span><span class="log-m '+type+'">'+msg+'</span>';
  d.appendChild(l);
  d.scrollTop=d.scrollHeight;
  while(d.children.length>30)d.firstChild.remove();
}

// Mode buttons
function setMode(m){
  mode=m;
  ['none','hands','full'].forEach(x=>{
    document.getElementById('m-'+x).classList.toggle('active',x===m);
  });
  log('Mode: '+m,'det');
}

// Gesture detection
function gesture(kps){
  if(!kps||kps.length<21)return 'Hand';
  const tips=[4,8,12,16,20],mcp=[2,5,9,13,17];
  const ext=[1,2,3,4].map(i=>kps[tips[i]].y<kps[mcp[i]].y);
  const th=Math.abs(kps[4].x-kps[2].x)>0.06;
  if(ext.every(Boolean)&&th)return 'Open \u270B';
  if(ext.every(f=>!f)&&!th)return 'Fist \u270A';
  if(ext[1]&&!ext[0]&&!ext[2]&&!ext[3])return 'Point \u261D';
  if(ext[1]&&ext[2]&&!ext[0]&&!ext[3])return 'Peace \u270C';
  if(th&&!ext[1]&&!ext[2]&&!ext[3])return 'Thumbs \uD83D\uDC4D';
  return 'Hand';
}

// Hand connections (MediaPipe 21-landmark topology)
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// Draw one hand
function drawHand(kps,side){
  const W=cvs.width,H=cvs.height;
  const c=side==='Left'
    ?{l:'rgba(52,211,153,0.9)',g:'rgba(52,211,153,0.4)'}
    :{l:'rgba(129,140,248,0.9)',g:'rgba(129,140,248,0.4)'};
  const p=k=>({x:k.x*W,y:k.y*H});
  // Glow pass
  CONN.forEach(([a,b])=>{
    const pa=p(kps[a]),pb=p(kps[b]);
    ctx.save();
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle=c.g;ctx.lineWidth=8;ctx.lineCap='round';ctx.filter='blur(4px)';
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle=c.l;ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.stroke();
  });
  // Joints
  kps.forEach((k,i)=>{
    const pt=p(k),isTip=[4,8,12,16,20].includes(i),r=isTip?5:3;
    ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
    ctx.fillStyle=isTip?'#fff':c.l;
    ctx.shadowColor=c.g;ctx.shadowBlur=isTip?12:6;
    ctx.fill();ctx.shadowBlur=0;
  });
}

// Render loop
function render(){
  cvs.width=vid.videoWidth||640;
  cvs.height=vid.videoHeight||480;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  if(mode!=='none'){
    if(leftHand)drawHand(leftHand,'Left');
    if(rightHand)drawHand(rightHand,'Right');
  }
  frameCount++;
  const now=performance.now();
  if(now-lastT>=1000){
    fps=Math.round(frameCount*1000/(now-lastT));
    frameCount=0;lastT=now;
    document.getElementById('fps').textContent=fps+' FPS';
    document.getElementById('s-fps').textContent=fps;
  }
  requestAnimationFrame(render);
}

// MediaPipe Hands init
function initHands(){
  log('Loading MediaPipe Hands\u2026');
  const hands=new Hands({
    locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/'+f
  });
  hands.setOptions({
    maxNumHands:2,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.5
  });
  hands.onResults(r=>{
    leftHand=null;rightHand=null;
    const ml=r.multiHandLandmarks||[],mh=r.multiHandedness||[];
    ml.forEach((lm,i)=>{
      const side=mh[i]&&mh[i].label?mh[i].label:'Right';
      const g=gesture(lm);
      if(side==='Left'){
        leftHand=lm;
        document.getElementById('hi-left').classList.add('active');
        document.getElementById('hg-left').textContent=g;
      } else {
        rightHand=lm;
        document.getElementById('hi-right').classList.add('active');
        document.getElementById('hg-right').textContent=g;
      }
      document.getElementById('s-hands').textContent=ml.length;
      document.getElementById('s-conf').textContent=Math.round(((mh[i]&&mh[i].score)||0.9)*100)+'%';
    });
    if(ml.length===0){
      document.getElementById('hi-left').classList.remove('active');
      document.getElementById('hg-left').textContent='';
      document.getElementById('hi-right').classList.remove('active');
      document.getElementById('hg-right').textContent='';
      document.getElementById('s-hands').textContent='0';
    }
  });
  hands.initialize().then(()=>{
    log('Hands model ready!','ok');
    document.getElementById('dot').classList.add('active');
    document.getElementById('stxt').textContent='Camera Active';
    // Auto-switch to Hands mode so skeleton is visible immediately
    setMode('hands');
    function sendFrame(){
      if(vid.readyState>=2)hands.send({image:vid});
      requestAnimationFrame(sendFrame);
    }
    sendFrame();
  }).catch(e=>{
    log('Hands failed: '+(e&&e.message?e.message:e),'warn');
  });
}

// Start camera automatically on load
navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720}},
  audio:false
}).then(stream=>{
  vid.srcObject=stream;
  vid.onloadedmetadata=()=>{
    vid.play();
    document.getElementById('s-res').textContent=vid.videoWidth+'x'+vid.videoHeight;
    log('Camera started','ok');
    render();
    setTimeout(initHands,500);
  };
}).catch(e=>{
  log('Camera error: '+(e&&e.message?e.message:e),'warn');
  document.getElementById('stxt').textContent='Camera denied';
});
</script>
</body>
</html>
