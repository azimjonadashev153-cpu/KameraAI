<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Face & Hand Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw}
#wrap{position:relative;width:100vw;height:100vh}
#vid{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
#oc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.corner{position:absolute;width:18px;height:18px;pointer-events:none;z-index:5}
.corner.tl{top:56px;left:10px;border-top:2px solid rgba(200,175,120,.5);border-left:2px solid rgba(200,175,120,.5)}
.corner.tr{top:56px;right:10px;border-top:2px solid rgba(200,175,120,.5);border-right:2px solid rgba(200,175,120,.5)}
.corner.bl{bottom:56px;left:10px;border-bottom:2px solid rgba(200,175,120,.5);border-left:2px solid rgba(200,175,120,.5)}
.corner.br{bottom:56px;right:10px;border-bottom:2px solid rgba(200,175,120,.5);border-right:2px solid rgba(200,175,120,.5)}
.scan{position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(200,175,120,.3),transparent);animation:scan 3s linear infinite;pointer-events:none;z-index:4}
@keyframes scan{0%{top:0}100%{top:100%}}
#topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent)}
.spill{display:flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);font-size:.68rem;color:#94a3b8;font-family:monospace;backdrop-filter:blur(10px)}
.sd{width:6px;height:6px;border-radius:50%;background:#ef4444;transition:all .3s}
.sd.on{background:#10b981;box-shadow:0 0 7px #10b981;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#fps-b{font-family:monospace;font-size:.68rem;color:#10b981;background:rgba(0,0,0,.5);border:1px solid rgba(16,185,129,.25);padding:3px 9px;border-radius:6px}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:linear-gradient(to top,rgba(0,0,0,.65),transparent)}
.pbtn{width:34px;height:34px;border-radius:50%;border:2px solid rgba(200,175,120,.25);background:rgba(0,0,0,.5);color:rgba(200,175,120,.5);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);font-family:monospace}
.pbtn:hover{border-color:rgba(200,175,120,.6);color:rgba(200,175,120,.9)}
.pbtn.active{border-color:rgb(200,175,120);background:rgba(200,175,120,.15);color:rgb(220,200,150);box-shadow:0 0 12px rgba(200,175,120,.35)}
.divider{width:1px;height:22px;background:rgba(255,255,255,.1)}
.mbtn{padding:5px 14px;border-radius:18px;border:1px solid rgba(200,175,120,.2);background:rgba(0,0,0,.5);color:rgba(200,175,120,.45);font-size:.7rem;font-weight:600;cursor:pointer;transition:all .25s;backdrop-filter:blur(10px);font-family:inherit}
.mbtn:hover{border-color:rgba(200,175,120,.5);color:rgba(200,175,120,.8)}
.mbtn.active{border-color:rgb(200,175,120);background:rgba(200,175,120,.12);color:rgb(220,200,150);box-shadow:0 0 10px rgba(200,175,120,.25)}
.plbl{font-size:.6rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
#glabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1rem;font-weight:700;color:rgba(220,200,150,.95);text-shadow:0 2px 8px rgba(0,0,0,.9);background:rgba(0,0,0,.4);padding:4px 14px;border-radius:20px;border:1px solid rgba(200,175,120,.3);display:none;z-index:10;pointer-events:none}
#glabel.show{display:block;animation:popIn .25s ease}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#loading{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:14px}
#loading.hidden{display:none}
.lring{width:52px;height:52px;border:3px solid rgba(200,175,120,.2);border-top-color:rgb(200,175,120);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{color:rgba(200,175,120,.8);font-size:.8rem;letter-spacing:1px;font-family:monospace}
</style>
</head>
<body>
<div id="wrap">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="oc"></canvas>
  <div class="scan"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="topbar">
    <div class="spill"><div class="sd" id="sd"></div><span id="stxt">Starting…</span></div>
    <div id="fps-b">-- FPS</div>
  </div>
  <div id="glabel"></div>
  <div id="controls">
    <span class="plbl">Persons:</span>
    <button class="pbtn active" id="p1" onclick="setP(1)">1</button>
    <button class="pbtn" id="p2" onclick="setP(2)">2</button>
    <button class="pbtn" id="p3" onclick="setP(3)">3</button>
    <div class="divider"></div>
    <button class="mbtn" id="m-none" onclick="setMode('none')">None</button>
    <button class="mbtn active" id="m-head" onclick="setMode('head')">😶 Head</button>
    <button class="mbtn" id="m-hands" onclick="setMode('hands')">✋ Hands</button>
    <button class="mbtn" id="m-both" onclick="setMode('both')">Both</button>
  </div>
  <div id="loading"><div class="lring"></div><div class="ltxt" id="ltxt">Loading AI…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js" crossorigin="anonymous"></script>
<script>
const vid=document.getElementById('vid'),oc=document.getElementById('oc'),ctx=oc.getContext('2d');
let mode='both',maxP=1,phase=0,frames=0,lastT=0,fps=0,lastR=null,gtTimer=null;

// ── BONE PALETTE (ivory/cream X-ray) ─────────────────────────
const B   =a=>`rgba(228,202,145,${a})`;  // main bone
const BH  =a=>`rgba(255,245,200,${a})`;  // highlight
const BS  =a=>`rgba(160,130,75,${a})`;   // shadow
const SKIN=a=>`rgba(210,170,120,${a})`;  // skin tone joints

// ── PERSON / MODE ─────────────────────────────────────────────
function setP(n){maxP=n;[1,2,3].forEach(i=>document.getElementById('p'+i).classList.toggle('active',i===n));}
function setMode(m){
  mode=m;
  ['none','head','hands','both'].forEach(x=>document.getElementById('m-'+x).classList.toggle('active',x===m));
}

// ── GESTURE ───────────────────────────────────────────────────
function gesture(kps){
  if(!kps||kps.length<21)return'';
  const tips=[4,8,12,16,20],mcp=[2,5,9,13,17];
  const e=[1,2,3,4].map(i=>kps[tips[i]].y<kps[mcp[i]].y);
  const th=Math.abs(kps[4].x-kps[2].x)>0.06;
  if(e.every(Boolean)&&th)return'Open ✋';
  if(e.every(f=>!f)&&!th)return'Fist ✊';
  if(e[1]&&!e[0]&&!e[2]&&!e[3])return'Point ☝';
  if(e[1]&&e[2]&&!e[0]&&!e[3])return'Peace ✌';
  if(th&&!e[1]&&!e[2]&&!e[3])return'Thumbs 👍';
  return'';
}
function showG(g){
  if(!g)return;
  const el=document.getElementById('glabel');
  if(g!==el.textContent){el.textContent=g;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(gtTimer);gtTimer=setTimeout(()=>el.classList.remove('show'),2000);}
}

// ── SMOOTHER ──────────────────────────────────────────────────
class Sm{constructor(a=.4){this.a=a;this.p=null;}
  run(lm){if(!lm){this.p=null;return null;}if(!this.p){this.p=lm.map(k=>({...k}));return this.p;}
    this.p=lm.map((k,i)=>{const q=this.p[i]||k;return{...k,x:q.x+this.a*(k.x-q.x),y:q.y+this.a*(k.y-q.y)};});return this.p;}
}
const SM={face:new Sm(.45),lh:new Sm(.4),rh:new Sm(.4)};

// ── LOW-LEVEL DRAW ────────────────────────────────────────────
function bone(ax,ay,bx,by,t,al){
  // shadow
  ctx.save();ctx.beginPath();ctx.moveTo(ax+1.5,ay+1.5);ctx.lineTo(bx+1.5,by+1.5);
  ctx.strokeStyle=`rgba(0,0,0,${.5*al})`;ctx.lineWidth=t+2;ctx.lineCap='round';ctx.filter='blur(2px)';ctx.stroke();ctx.restore();
  // glow
  ctx.save();ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
  ctx.strokeStyle=BH(.06*al);ctx.lineWidth=t+10;ctx.lineCap='round';ctx.filter='blur(7px)';ctx.stroke();ctx.restore();
  // gradient bone
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
  const nx=dy/len*t*.4,ny=-dx/len*t*.4;
  const g=ctx.createLinearGradient(ax+nx,ay+ny,ax-nx,ay-ny);
  g.addColorStop(0,BH(.9*al));g.addColorStop(.4,B(.95*al));g.addColorStop(.7,B(.8*al));g.addColorStop(1,BS(.6*al));
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.strokeStyle=g;ctx.lineWidth=t;ctx.lineCap='round';ctx.stroke();
}

function joint(x,y,r,al){
  ctx.beginPath();ctx.arc(x+1,y+1,r,0,Math.PI*2);ctx.fillStyle=`rgba(0,0,0,${.5*al})`;ctx.fill();
  const sg=ctx.createRadialGradient(x-r*.35,y-r*.38,r*.05,x,y,r);
  sg.addColorStop(0,BH(al));sg.addColorStop(.4,B(al*.95));sg.addColorStop(.8,B(al*.65));sg.addColorStop(1,BS(al*.45));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
  ctx.beginPath();ctx.arc(x-r*.3,y-r*.32,r*.28,0,Math.PI*2);ctx.fillStyle=BH(.5*al);ctx.fill();
}
</script>

<script>
// ── FACE MESH DRAWING (realistic animated skull) ──────────────
// FaceMesh indices for key features
const FACE_OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const L_EYE=[33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const R_EYE=[362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
const L_IRIS=[474,475,476,477];
const R_IRIS=[469,470,471,472];
const L_BROW=[70,63,105,66,107,55,65,52,53,46];
const R_BROW=[300,293,334,296,336,285,295,282,283,276];
const LIPS_OUT=[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];
const LIPS_IN=[78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95];
const NOSE_B=[168,6,197,195,5,4,45,220,115,48,64,98,97,2,326,327,294,290,455,305];

function drawFaceSkeleton(lm, W, H){
  if(!lm||lm.length<468)return;
  const p=k=>({x:lm[k].x*W, y:lm[k].y*H});

  // ── SKULL SHAPE (face oval as bone structure) ──
  const ovalPts=FACE_OVAL.map(i=>p(i));
  // Outer glow
  ctx.save();
  ctx.beginPath();ovalPts.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();
  ctx.strokeStyle=BH(.08);ctx.lineWidth=18;ctx.filter='blur(10px)';ctx.stroke();ctx.restore();
  // Bone oval
  const og=ctx.createLinearGradient(0,ovalPts[0].y,0,ovalPts[Math.floor(ovalPts.length/2)].y);
  og.addColorStop(0,B(.7));og.addColorStop(.5,B(.9));og.addColorStop(1,B(.65));
  ctx.beginPath();ovalPts.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();
  ctx.strokeStyle=og;ctx.lineWidth=4;ctx.filter='none';ctx.stroke();
  // Shadow fill
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fill();

  // ── CHEEKBONES ──
  [[234,93],[454,323],[127,162],[356,389]].forEach(([a,b])=>{
    const pa=p(a),pb=p(b);
    bone(pa.x,pa.y,pb.x,pb.y,3,.55);
  });

  // ── JAW ──
  const jaw=[172,136,150,149,176,148,152,377,400,378,379,365,397,288,361,323];
  for(let i=0;i<jaw.length-1;i++){
    const pa=p(jaw[i]),pb=p(jaw[i+1]);
    bone(pa.x,pa.y,pb.x,pb.y,3.5,.7);
  }

  // ── NOSE BRIDGE ──
  const noseBridge=[168,6,197,195,5,4];
  for(let i=0;i<noseBridge.length-1;i++){
    const pa=p(noseBridge[i]),pb=p(noseBridge[i+1]);
    bone(pa.x,pa.y,pb.x,pb.y,2.5,.65);
  }
  // Nose wings
  bone(p(4).x,p(4).y,p(48).x,p(48).y,2,.5);
  bone(p(4).x,p(4).y,p(278).x,p(278).y,2,.5);
  bone(p(2).x,p(2).y,p(48).x,p(48).y,2,.5);
  bone(p(2).x,p(2).y,p(278).x,p(278).y,2,.5);

  // ── EYE SOCKETS ──
  [L_EYE,R_EYE].forEach(eye=>{
    const epts=eye.map(i=>p(i));
    ctx.save();
    ctx.beginPath();epts.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();
    ctx.strokeStyle=B(.75);ctx.lineWidth=2.5;ctx.filter='none';ctx.stroke();
    // Socket glow
    ctx.strokeStyle=BH(.12);ctx.lineWidth=8;ctx.filter='blur(4px)';ctx.stroke();ctx.restore();
  });

  // ── PUPILS (irises — move with eyes) ──
  const drawIris=(iris,eyeCenter)=>{
    if(iris.every(i=>i<lm.length)){
      const pts=iris.map(i=>p(i));
      const cx=pts.reduce((s,q)=>s+q.x,0)/pts.length;
      const cy=pts.reduce((s,q)=>s+q.y,0)/pts.length;
      const r=Math.hypot(pts[0].x-cx,pts[0].y-cy)||5;
      // Eyeball white
      ctx.beginPath();ctx.arc(cx,cy,r*2.2,0,Math.PI*2);
      ctx.fillStyle=B(.12);ctx.fill();
      // Iris bone ring
      ctx.beginPath();ctx.arc(cx,cy,r*1.2,0,Math.PI*2);
      ctx.strokeStyle=B(.8);ctx.lineWidth=2;ctx.stroke();
      // Pupil
      ctx.beginPath();ctx.arc(cx,cy,r*.6,0,Math.PI*2);
      ctx.fillStyle=`rgba(30,20,10,.9)`;ctx.fill();
      // Specular dot
      ctx.beginPath();ctx.arc(cx-r*.3,cy-r*.3,r*.25,0,Math.PI*2);
      ctx.fillStyle=BH(.8);ctx.fill();
    }
  };
  drawIris(L_IRIS);drawIris(R_IRIS);

  // ── EYEBROWS (bone ridges) ──
  [L_BROW,R_BROW].forEach(brow=>{
    const bpts=brow.map(i=>p(i));
    for(let i=0;i<bpts.length-1;i++) bone(bpts[i].x,bpts[i].y,bpts[i+1].x,bpts[i+1].y,3,.7);
    bpts.forEach(pt=>joint(pt.x,pt.y,2.5,.7));
  });

  // ── ZYGOMATIC ARCH (cheekbone) ──
  bone(p(234).x,p(234).y,p(93).x,p(93).y,2.5,.5);
  bone(p(454).x,p(454).y,p(323).x,p(323).y,2.5,.5);

  // ── MOUTH (opens/closes with actual landmarks) ──
  const mOut=LIPS_OUT.map(i=>p(i));
  const mIn =LIPS_IN.map(i=>p(i));
  // Outer lip bone
  ctx.beginPath();mOut.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();
  ctx.strokeStyle=B(.8);ctx.lineWidth=2.5;ctx.stroke();
  // Inner lip — shows opening
  ctx.beginPath();mIn.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.closePath();
  // Check mouth openness
  const topLip=p(13),botLip=p(14),mouthH=Math.abs(botLip.y-topLip.y);
  const isOpen=mouthH>(p(61).x-p(291).x<0?0:p(61).x-p(291).x)*0.08+4;
  ctx.strokeStyle=isOpen?B(.9):B(.4);ctx.lineWidth=2;ctx.stroke();
  if(isOpen){ctx.fillStyle=`rgba(10,5,0,${Math.min(.85,mouthH/30)})`;ctx.fill();}
  // Teeth line when open
  if(mouthH>8){
    const midY=(topLip.y+botLip.y)/2;
    ctx.beginPath();ctx.moveTo(p(61).x,midY);ctx.lineTo(p(291).x,midY);
    ctx.strokeStyle=BH(.7);ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  }

  // ── KEY BONE JOINTS ──
  [1,9,10,151,234,454,127,356,93,323,152,168,2,94,4].forEach(i=>{
    if(i<lm.length){const pt=p(i);joint(pt.x,pt.y,3,.8);}
  });

  // ── FOREHEAD / BROW RIDGE ──
  const foreheadPts=[54,103,67,109,10,338,297,332,284];
  for(let i=0;i<foreheadPts.length-1;i++){
    const pa=p(foreheadPts[i]),pb=p(foreheadPts[i+1]);
    bone(pa.x,pa.y,pb.x,pb.y,2.5,.45);
  }
}
</script>

<script>
// ── HAND DRAWING ──────────────────────────────────────────────
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS=[4,8,12,16,20];

function drawHand(kps,W,H){
  if(!kps||kps.length<21)return;
  const p=k=>({x:kps[k].x*W,y:kps[k].y*H});
  HC.forEach(([a,b])=>{
    const pa=p(a),pb=p(b);
    const isFinger=a>=5||b>=5;
    bone(pa.x,pa.y,pb.x,pb.y,isFinger?3.5:5.5,.9);
  });
  for(let i=0;i<21;i++){
    const pt=p(i);
    const r=i===0?7:TIPS.includes(i)?5.5:3.5;
    joint(pt.x,pt.y,r,.9);
  }
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  phase+=0.07;
  oc.width=vid.videoWidth||640;
  oc.height=vid.videoHeight||480;
  ctx.clearRect(0,0,oc.width,oc.height);

  const W=oc.width,H=oc.height;

  if(mode!=='none'&&lastR){
    const r=lastR;
    const showHead  =(mode==='head'||mode==='both');
    const showHands =(mode==='hands'||mode==='both');

    if(showHead&&r.faceLandmarks){
      const fl=SM.face.run(r.faceLandmarks);
      drawFaceSkeleton(fl,W,H);
    }
    if(showHands){
      if(r.leftHandLandmarks){
        const lh=SM.lh.run(r.leftHandLandmarks);
        drawHand(lh,W,H);
        showG(gesture(lh));
      }
      if(r.rightHandLandmarks){
        const rh=SM.rh.run(r.rightHandLandmarks);
        drawHand(rh,W,H);
        showG(gesture(rh));
      }
    }
  }

  frames++;
  const now=performance.now();
  if(now-lastT>=1000){
    fps=Math.round(frames*1000/(now-lastT));
    frames=0;lastT=now;
    document.getElementById('fps-b').textContent=fps+' FPS';
  }
  requestAnimationFrame(render);
}

// ── HOLISTIC (modelComplexity=0 = MAX SPEED) ──────────────────
function init(){
  document.getElementById('ltxt').textContent='Loading model…';
  const h=new Holistic({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}`
  });
  h.setOptions({
    modelComplexity:0,           // 0=FASTEST
    smoothLandmarks:true,
    enableSegmentation:false,
    refineFaceLandmarks:true,    // enables iris tracking
    minDetectionConfidence:0.55,
    minTrackingConfidence:0.45
  });
  h.onResults(r=>{lastR=r;});
  h.initialize().then(()=>{
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('sd').classList.add('on');
    document.getElementById('stxt').textContent='AI Active';
    // MAX SPEED: no busy check, send every rAF
    let busy=false;
    function send(){
      if(!busy&&vid.readyState>=2){
        busy=true;
        h.send({image:vid}).then(()=>{busy=false;}).catch(()=>{busy=false;});
      }
      requestAnimationFrame(send);
    }
    send();
  }).catch(e=>{
    document.getElementById('ltxt').textContent='Failed: '+(e?.message||e);
  });
}

// ── CAMERA (auto-start) ───────────────────────────────────────
navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false
}).then(s=>{
  vid.srcObject=s;
  vid.onloadedmetadata=()=>{vid.play();render();setTimeout(init,200);};
}).catch(e=>{
  document.getElementById('ltxt').textContent='Camera: '+(e?.message||e);
  document.getElementById('stxt').textContent='Camera denied';
});
</script>
</body>
</html>
